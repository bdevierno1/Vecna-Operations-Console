# Data contract — operations
# Version: 1.0.0
# Template: data-contract-template.md

dataset:
  name: operations
  table: operations
  version: "1.0.0"
  description: >
    Records every passive-recon scan: lifecycle status, token usage,
    cost attribution, findings, and timing.

ownership:
  owner: ben@vecna.ai
  team: vecna-platform
  producer_service: backend/app/services/runner.py
  consumers:
    - frontend (operations list + report views)
    - billing service (cost roll-up into billing_sessions)
    - telemetry service

schema:
  fields:
    - name: id
      type: VARCHAR(36)
      nullable: false
      description: UUID primary key
    - name: session_id
      type: VARCHAR(36)
      nullable: true
      description: FK → billing_sessions.id (SET NULL on delete)
    - name: target_url
      type: VARCHAR(2048)
      nullable: false
    - name: status
      type: VARCHAR(32)
      nullable: false
      allowed_values: [pending, running, completed, failed]
    - name: cost_usd
      type: REAL
      nullable: false
      constraints: ">= 0"
    - name: credits_used
      type: REAL
      nullable: false
      constraints: ">= 0"
    - name: billable_total_usd
      type: REAL
      nullable: false
      constraints: ">= 0"
    - name: created_at
      type: DATETIME
      nullable: false
    - name: updated_at
      type: DATETIME
      nullable: false

quality_rules:
  primary_key: id
  not_null_cols:
    - id
    - target_url
    - status
    - cost_usd
    - credits_used
    - created_at
    - updated_at
  completeness_threshold_pct: 0.5   # null rate must stay below 0.5 %
  validity_rules:
    - type: allowed_values
      col: status
      allowed: [pending, running, completed, failed]
    - type: non_negative
      col: cost_usd
    - type: non_negative
      col: credits_used
    - type: non_negative
      col: billable_total_usd

slas:
  tier: 1
  freshness_timestamp_col: updated_at
  freshness_max_seconds: 3600   # Tier-1: rows must arrive within 1 h of real-time
  availability_target_pct: 99.9
